<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set Password — Chemistry Equations</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .password-page{max-width:520px;margin:80px auto;padding:28px}
    .password-page .card{padding:28px}
    .password-page label{display:block;font-weight:600;margin:16px 0}
    .password-page input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #aaa;border-radius:9px;font-size:16px}
    .password-page button{margin-top:10px}
    #status{min-height:24px;margin-top:16px;font-weight:600}
    .success{color:#087a22}.error{color:#c00000}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="learn.html"><span class="logo">⚗</span><span>Chemistry<span class="accent">Equations</span></span></a>
  </header>
  <main class="password-page">
    <section class="card">
      <h1>Set a new password</h1>
      <p>This is for an existing account that currently has no password. Your account and saved scores are preserved.</p>
      <form id="form">
        <label>Username
          <input id="username" autocomplete="username" required>
        </label>
        <label>New password
          <input id="password" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <label>Confirm new password
          <input id="confirm" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <button class="primary" type="submit">Set password</button>
      </form>
      <div id="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="worker-url.js?v=20260831-sitewide-4"></script>
  <script>
    const API=window.CHEMISTRY_API_WORKER||'https://chemistry-equations-api.reemkhmasalha.workers.dev';
    const form=document.getElementById('form');
    const status=document.getElementById('status');
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      status.className='';
      status.textContent='Setting password…';
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('password').value;
      const confirmPassword=document.getElementById('confirm').value;
      if(password.length<8){status.className='error';status.textContent='Password must be at least 8 characters.';return;}
      if(password!==confirmPassword){status.className='error';status.textContent='Passwords do not match.';return;}
      try{
        const r=await fetch(API+'/api/set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,confirmPassword})});
        const text=await r.text();
        let d={};try{d=JSON.parse(text)}catch{}
        if(!r.ok)throw new Error(d.error||'Could not set the password.');
        if(d.token&&d.user){
          localStorage.setItem('chemistryCurrentUser',JSON.stringify({...d.user,token:d.token}));
        }
        status.className='success';
        status.textContent='Password set successfully. Redirecting to your profile…';
        setTimeout(()=>location.href='profile.html',700);
      }catch(err){
        status.className='error';
        status.textContent=err.message||'Could not set the password.';
      }
    });
  </script>
</body>
</html>
