<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="site-build" content="analytics-location-fix-20260826"><title>Chemistry Equations — Admin</title><style>body{font-family:system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 16px;color:#202124}input,button{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:16px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{padding:18px;border:1px solid #ddd;border-radius:14px}.card{background:#f6f6f6}.big{font-size:28px;font-weight:700}section{margin:24px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.muted{color:#666}.error{color:#b00020}.success{color:#087a22}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin:3px}.scroll{overflow:auto}.privacy{font-size:13px;color:#555}.note{background:#fff8df;border:1px solid #e5cf72;padding:12px;border-radius:10px}</style></head><body><h1>Owner dashboard</h1><p class="muted">Private analytics for your Chemistry Equations site.</p><div id="login"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load" type="button">Open dashboard</button></div><p id="msg"></p><main id="dashboard" hidden></main><script>const API='https://chemistry-equations-api.reemkhmasalha.workers.dev';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(items,cols){return items.length?items.map(x=>`<tr>${cols.map(c=>`<td>${c(x)}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="10" class="muted">No data yet.</td></tr>'}async function loadStats(){const key=$('key').value.trim(),msg=$('msg');if(!key){msg.className='error';msg.textContent='Enter your admin key.';return}msg.className='muted';msg.textContent='Loading analytics…';try{const r=await fetch(API+'/api/admin/stats',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:'{}'});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load analytics.');$('login').hidden=true;$('dashboard').hidden=false;render(d);msg.className='success';msg.textContent='Analytics loaded.'}catch(e){msg.className='error';msg.textContent=e.message||'Unable to load analytics.'}}function render(d){const q=d.quiz_totals||{quizzes:0,average_score:0},p=d.periods||{daily:0,weekly:0,monthly:0},t=d.totals||{visits:0,unique_visitors:0};const countries=d.countries||[],cities=d.cities||[];const features=d.featurePeriod||d.features||[];$('dashboard').innerHTML=`<div class="note"><b>How visitor counting works:</b> “Unique browsers/devices” counts distinct anonymous visitor IDs, not guaranteed distinct people. One person can appear more than once if they use different browsers/devices or clear site data. The tracker now uses a first-party cookie plus local storage to reduce accidental duplicates. City is approximate IP-based geolocation, so it can be wrong by several kilometres or show the ISP's registered city. Exact physical location is not collected.</div><div class="cards"><div class="card"><div class="big">${(d.users||[]).length}</div>Registered accounts</div><div class="card"><div class="big">${d.active_users||0}</div>Active accounts<br><small>last 30 days</small></div><div class="card"><div class="big">${t.unique_visitors}</div>Unique browsers/devices</div><div class="card"><div class="big">${t.visits}</div>Page views</div><div class="card"><div class="big">${p.daily}</div>Unique browsers/devices today</div><div class="card"><div class="big">${p.weekly}</div>Last 7 days</div><div class="card"><div class="big">${p.monthly}</div>Last 30 days</div><div class="card"><div class="big">${q.quizzes}</div>Quizzes taken</div><div class="card"><div class="big">${Number(q.average_score||0).toFixed(1)}%</div>Average quiz score</div></div><div class="grid"><section><h2>Visitors by country</h2><p class="privacy">Aggregated counts only. No IP addresses or visitor IDs are shown.</p><div class="scroll"><table><tr><th>Country</th><th>Browsers/devices</th><th>Views</th></tr>${rows(countries,[x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section><section><h2>Approximate visitors by city</h2><p class="privacy">City is approximate IP geolocation, not GPS. It may identify the ISP/network city rather than the user's actual location.</p><div class="scroll"><table><tr><th>City</th><th>Country</th><th>Browsers/devices</th><th>Views</th></tr>${rows(cities,[x=>esc(x.city),x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section></div><section><h2>Visitors by day</h2><table><tr><th>Day</th><th>Browsers/devices</th><th>Views</th></tr>${rows((d.visitorsByDay||[]).slice(-30),[x=>esc(x.day),x=>x.visitors,x=>x.views])}</table></section><div class="grid"><section><h2>Most used features</h2>${features.map(x=>`<span class="pill">${esc(x.feature)}: ${x.uses}</span>`).join('')||'<p class="muted">No feature events yet.</p>'}</section><section><h2>Quiz difficulty</h2>${(d.difficulty||[]).map(x=>`<span class="pill">${esc(x.difficulty)}: ${x.uses}</span>`).join('')||'<p class="muted">No quiz analytics yet.</p>'}</section></div><section><h2>Balancer vs Quiz vs Learning</h2><div class="cards">${['Balancer','Quiz','Learning','Checker','Challenges'].map(f=>{const x=features.find(a=>String(a.feature).toLowerCase()===f.toLowerCase());return `<div class="card"><div class="big">${x?x.uses:0}</div>${f}<br><small>last 30 days</small></div>`}).join('')}</div></section><section><h2>Most commonly missed questions</h2><div class="scroll"><table><tr><th>Question</th><th>Misses</th></tr>${rows(d.missed||[],[x=>esc(x.question),x=>x.misses])}</table></div></section><section><h2>Accounts</h2><div class="scroll"><table><tr><th>Name</th><th>Username</th><th>Created</th></tr>${rows(d.users||[],[u=>esc(u.name),u=>esc(u.username),u=>new Date(u.created_at).toLocaleString()])}</table></div></section><section><h2>Page usage</h2><table><tr><th>Page</th><th>Views</th><th>Browsers/devices</th></tr>${rows(d.pages||[],[x=>esc(x.path),x=>x.views,x=>x.visitors])}</table></section>`}$('load').onclick=loadStats;$('key').onkeydown=e=>{if(e.key==='Enter')loadStats()};</script></body></html>
