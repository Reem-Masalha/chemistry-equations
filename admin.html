<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="site-build" content="location-analytics-20260826"><title>Chemistry Equations — Admin</title><style>body{font-family:system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 16px;color:#202124}input,button{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:16px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{padding:18px;border:1px solid #ddd;border-radius:14px}.card{background:#f6f6f6}.big{font-size:28px;font-weight:700}section{margin:24px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.muted{color:#666}.error{color:#b00020}.success{color:#087a22}.bar{display:flex;align-items:end;gap:5px;height:180px;border-bottom:1px solid #bbb;padding:10px 5px}.bar i{flex:1;min-width:8px;background:#777;border-radius:4px 4px 0 0;position:relative}.bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:end;height:170px}.bar small{text-align:center;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin:3px}.scroll{overflow:auto}.privacy{font-size:13px;color:#555}</style></head><body><h1>Owner dashboard</h1><p class="muted">Private analytics for your Chemistry Equations site.</p><div id="login"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load" type="button">Open dashboard</button></div><p id="msg"></p><main id="dashboard" hidden></main><script>const API='https://chemistry-equations-api.reemkhmasalha.workers.dev';const $=id=>document.getElementById(id);async function loadStats(){const key=$('key').value.trim(),msg=$('msg');if(!key){msg.className='error';msg.textContent='Enter your admin key.';return}msg.className='muted';msg.textContent='Loading analytics…';try{const r=await fetch(API+'/api/admin/stats',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:'{}'});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load analytics.');$('login').hidden=true;$('dashboard').hidden=false;render(d);msg.className='success';msg.textContent='Analytics loaded.'}catch(e){msg.className='error';msg.textContent=e.message||'Unable to load analytics.'}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rows(items,cols){return items.length?items.map(x=>`<tr>${cols.map(c=>`<td>${c(x)}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="10" class="muted">No data yet.</td></tr>'}function render(d){const q=d.quiz_totals||{quizzes:0,average_score:0},p=d.periods||{daily:0,weekly:0,monthly:0},t=d.totals||{visits:0,unique_visitors:0};const max=Math.max(1,...(d.visitorsByDay||[]).map(x=>+x.visitors));const days=(d.visitorsByDay||[]).slice(-30);const countries=d.countries||[],cities=d.cities||[];$('dashboard').innerHTML=`<div class="cards"><div class="card"><div class="big">${(d.users||[]).length}</div>Registered accounts</div><div class="card"><div class="big">${d.active_users||0}</div>Active users<br><small>last 30 days</small></div><div class="card"><div class="big">${t.unique_visitors}</div>Unique visitors</div><div class="card"><div class="big">${t.visits}</div>Page views</div><div class="card"><div class="big">${p.daily}</div>Visitors today</div><div class="card"><div class="big">${p.weekly}</div>Visitors this week</div><div class="card"><div class="big">${p.monthly}</div>Visitors this month</div><div class="card"><div class="big">${q.quizzes}</div>Quizzes taken</div><div class="card"><div class="big">${Number(q.average_score||0).toFixed(1)}%</div>Average quiz score</div></div><section><h2>Visitors</h2><div class="bar">${days.map(x=>`<div class="bar-wrap"><i style="height:${Math.max(4,Math.round(+x.visitors/max*150))}px" title="${x.day}: ${x.visitors} visitors"></i><small>${esc(x.day.slice(5))}</small></div>`).join('')}</div><p class="muted">Daily unique visitors for the last 30 days.</p></section><div class="grid"><section><h2>Visitors by country</h2><p class="privacy">Aggregated counts only. No IP addresses or visitor IDs are shown.</p><div class="scroll"><table><tr><th>Country</th><th>Unique visitors</th><th>Views</th></tr>${rows(countries,[x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section><section><h2>Visitors by city</h2><p class="privacy">Aggregated counts only. No IP addresses or visitor IDs are shown.</p><div class="scroll"><table><tr><th>City</th><th>Country</th><th>Unique visitors</th><th>Views</th></tr>${rows(cities,[x=>esc(x.city),x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section></div><div class="grid"><section><h2>Quiz difficulty</h2>${(d.difficulty||[]).map(x=>`<span class="pill">${esc(x.difficulty)}: ${x.uses}</span>`).join('')||'<p class="muted">No quiz analytics yet.</p>'}</section><section><h2>Most used features</h2>${(d.featurePeriod||d.features||[]).map(x=>`<span class="pill">${esc(x.feature)}: ${x.uses}</span>`).join('')||'<p class="muted">No feature events yet.</p>'}</section></div><section><h2>Balancer vs Quiz vs Learning</h2><div class="cards">${['Balancer','Quiz','Learning','Checker','Challenges'].map(f=>{const x=(d.featurePeriod||[]).find(a=>String(a.feature).toLowerCase()===f.toLowerCase());return `<div class="card"><div class="big">${x?x.uses:0}</div>${f} usage<br><small>last 30 days</small></div>`}).join('')}</div></section><section><h2>Most commonly missed questions</h2><div class="scroll"><table><tr><th>Question</th><th>Misses</th></tr>${rows(d.missed||[],[x=>esc(x.question),x=>x.misses])}</table></div></section><section><h2>Accounts</h2><div class="scroll"><table><tr><th>Name</th><th>Username</th><th>Created</th></tr>${rows(d.users||[],[u=>esc(u.name),u=>esc(u.username),u=>new Date(u.created_at).toLocaleString()])}</table></div></section><section><h2>Recent quiz scores</h2><div class="scroll"><table><tr><th>User</th><th>Difficulty</th><th>Score</th><th>Date</th></tr>${rows(d.scores||[],[x=>esc(x.username),x=>esc(x.stage),x=>`${x.score}/${x.total}`,x=>new Date(x.created_at).toLocaleString()])}</table></div></section><section><h2>Page usage</h2><table><tr><th>Page</th><th>Views</th><th>Visitors</th></tr>${rows(d.pages||[],[x=>esc(x.path),x=>x.views,x=>x.visitors])}</table></section>`}$('load').onclick=loadStats;$('key').onkeydown=e=>{if(e.key==='Enter')loadStats()};</script></body></html>
