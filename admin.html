<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="site-build" content="analytics-pwa-20260830-02"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="mobile-fixes.css?v=20260830-02"><title>Chemistry Equations — Admin</title><style>body{font-family:system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 16px;color:#202124;overflow-x:hidden}input,button{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:16px;box-sizing:border-box}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{padding:18px;border:1px solid #ddd;border-radius:14px}.card{background:#f6f6f6}.big{font-size:28px;font-weight:700}section{margin:24px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd;vertical-align:top}.muted{color:#666}.error{color:#b00020}.success{color:#087a22}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin:3px}.scroll{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}.privacy{font-size:13px;color:#555}.note{background:#fff8df;border:1px solid #e5cf72;padding:12px;border-radius:10px}.chart{display:flex;align-items:flex-end;gap:10px;height:220px;padding:20px 8px 0;border-bottom:1px solid #bbb}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:100%;max-width:48px;min-height:2px;background:#3158d6;border-radius:6px 6px 0 0}.bar-label{font-size:12px}.bar-value{font-size:11px;color:#666}.admin-tools-card{border:2px solid #ddd;background:#fbfbfb}.admin-tools-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.admin-tools-buttons button{width:100%;min-height:48px;background:white}.feedback-message{white-space:pre-wrap;word-break:break-word;min-width:260px}.feedback-meta{white-space:nowrap}@media(max-width:600px){body{margin:12px auto;padding:0 10px}.cards{grid-template-columns:1fr 1fr;gap:8px}.card,section{padding:14px}.big{font-size:24px}.grid{grid-template-columns:1fr;gap:12px}#login{display:flex;flex-direction:column;gap:8px}#key,#load{width:100%;min-height:48px}.chart{gap:5px;height:180px;padding-left:2px;padding-right:2px}.bar-label{font-size:10px}.bar-value{font-size:10px}.scroll table{min-width:560px}h1{font-size:30px;line-height:1.1}h2{font-size:23px}section{margin:16px 0}.note{font-size:13px}.admin-tools-buttons{grid-template-columns:1fr}}</style></head><body><h1>Owner dashboard</h1><p class="muted">Private, aggregated analytics for Chemistry Equations.</p><div id="login"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load" type="button">Open dashboard</button></div><p id="msg"></p><main id="dashboard" hidden></main><script>const API='https://chemistry-equations-api.reemkhmasalha.workers.dev',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function displayPageName(path){try{const raw=String(path||'').trim(),file=raw.split('?')[0].split('#')[0].replace(/\\/g,'/').split('/').filter(Boolean).pop()||'index.html';const names={'index.html':'Balancer','learn.html':'Learning','personal-quiz.html':'Quiz','challenges.html':'Challenges','checker.html':'Checker','profile.html':'Profile','admin.html':'Admin','quiz.html':'Quiz'};if(names[file])return names[file];const clean=file.replace(/\.html$/i,'').replace(/[-_]+/g,' ').trim();return clean?clean.replace(/\b\w/g,c=>c.toUpperCase()):'Home'}catch{return 'Home'}}function rows(a,cols){return a.length?a.map(x=>`<tr>${cols.map(c=>`<td>${c(x)}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="10" class="muted">No data yet.</td></tr>'}function graph(a){a=(a||[]).slice(-7);if(!a.length)return '<p class="muted">No visitor data yet.</p>';const max=Math.max(1,...a.map(x=>Number(x.visitors)||0));return `<div class="chart">${a.map(x=>{const v=Number(x.visitors)||0,h=Math.max(2,v/max*180);const day=new Date(String(x.day)+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});return `<div class="bar-wrap"><span class="bar-value">${v}</span><div class="bar" style="height:${h}px"></div><span class="bar-label">${day}</span></div>`}).join('')}</div>`}async function loadFeedback(key){const box=$('feedbackBox');if(!box)return;box.innerHTML='<p class="muted">Loading feedback…</p>';try{const r=await fetch(API+'/api/admin/feedback',{method:'GET',headers:{'x-admin-key':key}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load feedback.');const items=d.feedback||[];box.innerHTML=`<p class="muted">${items.length} message${items.length===1?'':'s'} stored. Newest first.</p><div class="scroll"><table><tr><th>Type</th><th>Message</th><th>Name</th><th>Email</th><th>Received</th><th>Status</th></tr>${items.length?items.map(x=>`<tr><td><span class="pill">${esc(x.type)}</span></td><td class="feedback-message">${esc(x.message)}</td><td>${esc(x.name)||'—'}</td><td>${esc(x.email)||'—'}</td><td class="feedback-meta">${x.created_at?new Date(x.created_at).toLocaleString():'—'}</td><td>${esc(x.status)||'New'}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">No feedback yet.</td></tr>'}</table></div>`}catch(e){box.innerHTML=`<p class="error">${esc(e.message||'Unable to load feedback.')}</p>`}}async function loadStats(){const key=$('key').value.trim(),msg=$('msg');if(!key){msg.className='error';msg.textContent='Enter your admin key.';return}msg.className='muted';msg.textContent='Loading analytics…';try{const r=await fetch(API+'/api/admin/stats',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load analytics.');$('login').hidden=true;$('dashboard').hidden=false;render(d,key);msg.className='success';msg.textContent='Analytics loaded.'}catch(e){msg.className='error';msg.textContent=e.message||'Unable to load analytics.'}}function render(d,key){const q=d.quiz_totals||{quizzes:0,average_score:0},p=d.periods||{daily:0,weekly:0,monthly:0},t=d.totals||{visits:0,unique_visitors:0},features=d.featurePeriod||d.features||[];const countries=d.countries||[],cities=d.cities||[];const balance=['Balancer','Quiz','Learning','Checker','Challenges'].map(f=>{const x=features.find(a=>String(a.feature).toLowerCase()===f.toLowerCase());return `<div class="card"><div class="big">${x?x.uses:0}</div>${f}<br><small>last 30 days</small></div>`}).join('');$('dashboard').innerHTML=`<section id="adminTesting" class="admin-tools-card"><h2>Admin testing tools</h2><p class="muted">These controls are only for testing this browser. They do not modify student accounts.</p><div class="admin-tools-buttons"><button id="replayDaily" type="button">Replay Daily Challenge</button><button id="freshDaily" type="button">Reset &amp; Open Learn</button><button id="clearProgress" type="button">Clear Test Progress</button></div><p id="adminToolMsg" class="muted"></p></section><div class="note"><b>Privacy:</b> visitor tables show aggregated country/city counts only. No IP addresses or visitor IDs are displayed. City is approximate IP-based geolocation and can differ from the visitor's actual location.</div><div class="cards"><div class="card"><div class="big">${(d.users||[]).length}</div>Total registered accounts</div><div class="card"><div class="big">${d.active_users||0}</div>Active users<br><small>last 30 minutes</small></div><div class="card"><div class="big">${t.unique_visitors}</div>Unique viewers</div><div class="card"><div class="big">${t.visits}</div>Total page views</div><div class="card"><div class="big">${p.daily}</div>Daily visitors</div><div class="card"><div class="big">${p.weekly}</div>Weekly visitors</div><div class="card"><div class="big">${p.monthly}</div>Monthly visitors</div><div class="card"><div class="big">${q.quizzes}</div>Quizzes taken</div><div class="card"><div class="big">${Number(q.average_score||0).toFixed(1)}%</div>Average quiz score</div></div><section><h2>Feedback &amp; suggestions</h2><p class="muted">Messages submitted through the Contact page. Only the owner dashboard can retrieve them.</p><button id="refreshFeedback" type="button">Refresh feedback</button><div id="feedbackBox"><p class="muted">Loading feedback…</p></div></section><section><h2>Visitors — last 7 days</h2><p class="muted">Unique viewers per day</p>${graph(d.visitorsByDay)}</section><div class="grid"><section><h2>Visitors by country</h2><p class="privacy">Aggregated counts only.</p><div class="scroll"><table><tr><th>Country</th><th>Different viewers</th><th>Views</th></tr>${rows(countries,[x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section><section><h2>Visitors by city</h2><p class="privacy">Approximate IP-based city. Not GPS.</p><div class="scroll"><table><tr><th>City</th><th>Country</th><th>Different viewers</th><th>Views</th></tr>${rows(cities,[x=>esc(x.city),x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section></div><section><h2>Pages viewed by different viewers</h2><p class="muted">Page names are shown instead of URLs.</p><div class="scroll"><table><tr><th>Page</th><th>Views</th><th>Different viewers</th></tr>${rows(d.pages||[],[x=>esc(displayPageName(x.path)),x=>x.views,x=>x.visitors])}</table></div></section><section><h2>Most popular difficulty</h2>${(d.difficulty||[]).length?`<span class="pill">${esc(d.difficulty[0].difficulty)}: ${d.difficulty[0].uses}</span>`:'<span class="muted">No quiz difficulty data yet.</span>'}</section><section><h2>Most used features</h2>${features.map(x=>`<span class="pill">${esc(x.feature)}: ${x.uses}</span>`).join('')||'<p class="muted">No feature events yet.</p>'}</section><section><h2>Balancer vs Quiz vs Learning</h2><div class="cards">${balance}</div></section><section><h2>Most commonly missed questions</h2><div class="scroll"><table><tr><th>Question</th><th>Misses</th></tr>${rows(d.missed||[],[x=>esc(x.question),x=>x.misses])}</table></div></section><section><h2>Visitors by day</h2><div class="scroll"><table><tr><th>Day</th><th>Different viewers</th><th>Views</th></tr>${rows((d.visitorsByDay||[]).slice(-30),[x=>esc(x.day),x=>x.visitors,x=>x.views])}</table></div></section><section><h2>Accounts</h2><div class="scroll"><table><tr><th>Name</th><th>Username</th><th>Created</th></tr>${rows(d.users||[],[u=>esc(u.name),u=>esc(u.username),u=>new Date(u.created_at).toLocaleString()])}</table></div></section>`;bindAdminTesting();$('refreshFeedback').onclick=()=>loadFeedback(key);loadFeedback(key)}function clearKeys(prefixes){try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&prefixes.some(p=>k.toLowerCase().includes(p)))keys.push(k)}keys.forEach(k=>localStorage.removeItem(k));return keys.length}catch{return 0}}function bindAdminTesting(){const msg=$('adminToolMsg');$('replayDaily').onclick=()=>{try{sessionStorage.setItem('chemistryAdminReplayRequested','1')}catch{}location.href='learn.html?adminReplay='+Date.now()};$('freshDaily').onclick=()=>{const n=clearKeys(['chemistrydaily','dailychallenge','dailystreak','dailyxp']);try{sessionStorage.setItem('chemistryAdminReplayRequested','1')}catch{}if(msg)msg.textContent='Cleared '+n+' local Daily Challenge test entries. Opening Learn…';setTimeout(()=>location.href='learn.html?adminReplay='+Date.now(),250)};$('clearProgress').onclick=()=>{const n=clearKeys(['chemistrystudentproduct','chemistryprogress','chemistrystats','chemistryxp','chemistrystreak']);if(msg)msg.textContent='Cleared '+n+' local progress entries on this browser.'}}$('load').onclick=loadStats;$('key').onkeydown=e=>{if(e.key==='Enter')loadStats()};</script></body></html>
