<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemistry Equations — Admin</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 16px}input,button{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:16px}button{cursor:pointer}section{margin:24px 0;padding:18px;border:1px solid #ddd;border-radius:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{padding:16px;background:#f4f4f4;border-radius:12px;min-width:150px}.error{color:#b00020}.success{color:#087a22}.muted{color:#666}</style></head><body><h1>Owner dashboard</h1><p>This page is protected by your Cloudflare Worker admin key.</p><div id="login"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load" type="button">Open dashboard</button></div><p id="msg"></p><main id="dashboard" hidden></main><script>const API='https://chemistry-equations-api.reemkhmasalha.workers.dev';const $=id=>document.getElementById(id);async function request(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{return await fetch(API+path,{...options,mode:'cors',signal:controller.signal})}finally{clearTimeout(timer)}}$('load').onclick=async()=>{const key=$('key').value;const msg=$('msg');if(!key){msg.className='error';msg.textContent='Enter your admin key.';return}msg.className='muted';msg.textContent='Checking the Cloudflare API…';try{const health=await request('/health');if(!health.ok)throw Error('Cloudflare API returned HTTP '+health.status+' from /health.');msg.textContent='API reachable. Loading dashboard…';const r=await request('/api/admin/stats',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:'{}'});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error(d.error||('Cloudflare API returned HTTP '+r.status+'.'));if(!d.users||!d.totals||!d.pages||!d.scores)throw Error('The Cloudflare API response is missing dashboard data.');$('login').hidden=true;$('dashboard').hidden=false;$('dashboard').innerHTML='<div class="cards"><div class="card"><b>'+d.users.length+'</b><br>Accounts</div><div class="card"><b>'+d.totals.visits+'</b><br>Page views</div><div class="card"><b>'+d.totals.unique_visitors+'</b><br>Unique visitors</div></div><section><h2>Accounts</h2><table><tr><th>Name</th><th>Username</th><th>Created</th></tr>'+d.users.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td>'+new Date(u.created_at).toLocaleString()+'</td></tr>').join('')+'</table></section><section><h2>Pages</h2><table><tr><th>Page</th><th>Views</th></tr>'+d.pages.map(x=>'<tr><td>'+esc(x.path)+'</td><td>'+x.views+'</td></tr>').join('')+'</table></section><section><h2>Recent scores</h2><table><tr><th>User</th><th>Stage</th><th>Score</th><th>Date</th></tr>'+d.scores.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.stage)+'</td><td>'+x.score+'/'+x.total+'</td><td>'+new Date(x.created_at).toLocaleString()+'</td></tr>').join('')+'</table></section>';msg.className='success';msg.textContent='Dashboard loaded.'}catch(e){msg.className='error';msg.textContent=e.name==='AbortError'?'The Cloudflare API took too long to respond.':(e.message||'Unable to connect to the Cloudflare API.');}};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
