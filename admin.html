<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="site-build" content="analytics-pwa-20260826"><link rel="manifest" href="manifest.webmanifest"><title>Chemistry Equations — Admin</title><style>body{font-family:system-ui,sans-serif;max-width:1200px;margin:30px auto;padding:0 16px;color:#202124}input,button{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:16px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{padding:18px;border:1px solid #ddd;border-radius:14px}.card{background:#f6f6f6}.big{font-size:28px;font-weight:700}section{margin:24px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.muted{color:#666}.error{color:#b00020}.success{color:#087a22}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin:3px}.scroll{overflow:auto}.privacy{font-size:13px;color:#555}.note{background:#fff8df;border:1px solid #e5cf72;padding:12px;border-radius:10px}.chart{display:flex;align-items:flex-end;gap:10px;height:220px;padding:20px 8px 0;border-bottom:1px solid #bbb}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:100%;max-width:48px;min-height:2px;background:#3158d6;border-radius:6px 6px 0 0}.bar-label{font-size:12px}.bar-value{font-size:11px;color:#666}@media(max-width:600px){body{margin:15px auto}.chart{gap:5px}}</style></head><body><h1>Owner dashboard</h1><p class="muted">Private, aggregated analytics for Chemistry Equations.</p><div id="login"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load" type="button">Open dashboard</button></div><p id="msg"></p><main id="dashboard" hidden></main><script>const API='https://chemistry-equations-api.reemkhmasalha.workers.dev',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function displayPageName(path){try{const u=new URL(String(path),location.origin),file=u.pathname.split('/').filter(Boolean).pop()||'Home';const names={'index.html':'Balancer','learn.html':'Learning','personal-quiz.html':'Quiz','challenges.html':'Challenges','checker.html':'Checker','profile.html':'Profile','admin.html':'Admin'};return names[file]||file.replace(/\.html$/i,'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}catch{return String(path).split('/').filter(Boolean).pop()||'Home'}}function rows(a,cols){return a.length?a.map(x=>`<tr>${cols.map(c=>`<td>${c(x)}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="10" class="muted">No data yet.</td></tr>'}function graph(a){a=(a||[]).slice(-7);if(!a.length)return '<p class="muted">No visitor data yet.</p>';const max=Math.max(1,...a.map(x=>Number(x.visitors)||0));return `<div class="chart">${a.map(x=>{const v=Number(x.visitors)||0,h=Math.max(2,v/max*180);const day=new Date(String(x.day)+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});return `<div class="bar-wrap"><span class="bar-value">${v}</span><div class="bar" style="height:${h}px"></div><span class="bar-label">${day}</span></div>`}).join('')}</div>`}async function loadStats(){const key=$('key').value.trim(),msg=$('msg');if(!key){msg.className='error';msg.textContent='Enter your admin key.';return}msg.className='muted';msg.textContent='Loading analytics…';try{const r=await fetch(API+'/api/admin/stats',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load analytics.');$('login').hidden=true;$('dashboard').hidden=false;render(d);msg.className='success';msg.textContent='Analytics loaded.'}catch(e){msg.className='error';msg.textContent=e.message||'Unable to load analytics.'}}function render(d){const q=d.quiz_totals||{quizzes:0,average_score:0},p=d.periods||{daily:0,weekly:0,monthly:0},t=d.totals||{visits:0,unique_visitors:0},features=d.featurePeriod||d.features||[];const countries=d.countries||[],cities=d.cities||[];const balance=['Balancer','Quiz','Learning','Checker','Challenges'].map(f=>{const x=features.find(a=>String(a.feature).toLowerCase()===f.toLowerCase());return `<div class="card"><div class="big">${x?x.uses:0}</div>${f}<br><small>last 30 days</small></div>`}).join('');$('dashboard').innerHTML=`<div class="note"><b>Privacy:</b> visitor tables show aggregated country/city counts only. No IP addresses or visitor IDs are displayed. City is approximate IP-based geolocation and can differ from the visitor's actual location.</div><div class="cards"><div class="card"><div class="big">${(d.users||[]).length}</div>Total registered accounts</div><div class="card"><div class="big">${d.active_users||0}</div>Active users<br><small>last 30 days</small></div><div class="card"><div class="big">${t.unique_visitors}</div>Unique viewers</div><div class="card"><div class="big">${t.visits}</div>Total page views</div><div class="card"><div class="big">${p.daily}</div>Daily visitors</div><div class="card"><div class="big">${p.weekly}</div>Weekly visitors</div><div class="card"><div class="big">${p.monthly}</div>Monthly visitors</div><div class="card"><div class="big">${q.quizzes}</div>Quizzes taken</div><div class="card"><div class="big">${Number(q.average_score||0).toFixed(1)}%</div>Average quiz score</div></div><section><h2>Visitors — last 7 days</h2><p class="muted">Unique viewers per day</p>${graph(d.visitorsByDay)}</section><div class="grid"><section><h2>Visitors by country</h2><p class="privacy">Aggregated counts only.</p><div class="scroll"><table><tr><th>Country</th><th>Different viewers</th><th>Views</th></tr>${rows(countries,[x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section><section><h2>Visitors by city</h2><p class="privacy">Approximate IP-based city. Not GPS.</p><div class="scroll"><table><tr><th>City</th><th>Country</th><th>Different viewers</th><th>Views</th></tr>${rows(cities,[x=>esc(x.city),x=>esc(x.country),x=>x.visitors,x=>x.views])}</table></div></section></div><section><h2>Pages viewed by different viewers</h2><p class="muted">Each page shows both total views and the number of different anonymous viewers.</p><div class="scroll"><table><tr><th>Page</th><th>Views</th><th>Different viewers</th></tr>${rows(d.pages||[],[x=>esc(displayPageName(x.path)),x=>x.views,x=>x.visitors])}</table></div></section><section><h2>Most popular difficulty</h2>${(d.difficulty||[]).length?`<span class="pill">${esc(d.difficulty[0].difficulty)}: ${d.difficulty[0].uses}</span>`:'<span class="muted">No quiz difficulty data yet.</span>'}</section><section><h2>Most used features</h2>${features.map(x=>`<span class="pill">${esc(x.feature)}: ${x.uses}</span>`).join('')||'<p class="muted">No feature events yet.</p>'}</section><section><h2>Balancer vs Quiz vs Learning</h2><div class="cards">${balance}</div></section><section><h2>Most commonly missed questions</h2><div class="scroll"><table><tr><th>Question</th><th>Misses</th></tr>${rows(d.missed||[],[x=>esc(x.question),x=>x.misses])}</table></div></section><section><h2>Visitors by day</h2><div class="scroll"><table><tr><th>Day</th><th>Different viewers</th><th>Views</th></tr>${rows((d.visitorsByDay||[]).slice(-30),[x=>esc(x.day),x=>x.visitors,x=>x.views])}</table></div></section><section><h2>Accounts</h2><div class="scroll"><table><tr><th>Name</th><th>Username</th><th>Created</th></tr>${rows(d.users||[],[u=>esc(u.name),u=>esc(u.username),u=>new Date(u.created_at).toLocaleString()])}</table></div></section>`}$('load').onclick=loadStats;$('key').onkeydown=e=>{if(e.key==='Enter')loadStats()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
