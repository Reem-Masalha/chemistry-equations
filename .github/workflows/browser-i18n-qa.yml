name: Browser visual QA — English, Arabic, Hebrew

on:
  push:
    branches: [main]
    paths:
      - 'tests/browser-i18n-qa.mjs'
      - '.github/workflows/browser-i18n-qa.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-i18n-qa-v2
  cancel-in-progress: true

jobs:
  browser-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for this commit to be live on GitHub Pages
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://reem-masalha.github.io/chemistry-equations/index.html
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsSL "$SITE_URL" | grep -F "cache-bust.js?v=$EXPECTED_SHA" >/dev/null; then
              echo "GitHub Pages is serving $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for Pages deployment ($attempt/36)…"
            sleep 5
          done
          echo "Timed out waiting for the current commit to deploy"
          exit 1

      - name: Test live site in 3 languages × 2 viewport sizes
        run: node tests/browser-i18n-qa.mjs

      - name: Upload screenshots and translation audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-i18n-visual-qa
          path: browser-i18n-artifacts/
          if-no-files-found: warn
          retention-days: 14
