name: Deploy Cloudflare Handwriting Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee "$GITHUB_WORKSPACE/deploy.log"
      - name: Publish Worker URL to the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1 | sed 's/[).,]$//')
          if [ -z "$URL" ]; then
            echo 'Could not find workers.dev URL in deployment output:'
            cat deploy.log
            exit 1
          fi
          printf '%s\n' "// Automatically generated by the Cloudflare deployment workflow." "window.CHEMISTRY_HANDWRITING_WORKER = '$URL';" > worker-url.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-url.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Set deployed handwriting worker URL"
          git push
