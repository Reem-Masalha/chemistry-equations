name: Build Nonogram APK
on:
  push:
    branches: [ nonogram-android ]
    paths:
      - 'nonogram-android/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'nonogram-android/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nonogram-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK structure and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest.xml|classes.dex'
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          ${ANDROID_HOME}/build-tools/35.0.0/aapt2 dump badging "$APK" | head -20
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nonogram-puzzle-apk
          path: nonogram-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
