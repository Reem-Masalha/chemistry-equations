name: Deploy Chemistry Equations Cloudflare API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global wrangler@latest
      - name: Ensure database exists and migrate
        working-directory: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          DB_JSON=$(wrangler d1 list --json)
          ID=$(printf '%s' "$DB_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const r=Array.isArray(a)?a:a.result;const x=(r||[]).find(x=>x.name==='chemistry-equations-db');if(!x){console.error(JSON.stringify(a));process.exit(1)}console.log(x.uuid)})")
          if [ -z "$ID" ]; then echo 'Could not find chemistry-equations-db.'; exit 1; fi
          sed -i "s/REPLACE_AFTER_D1_CREATION/$ID/" wrangler.toml
          wrangler d1 execute chemistry-equations-db --remote --command="ALTER TABLE users ADD COLUMN password_hash TEXT;" || true
          wrangler d1 execute chemistry-equations-db --remote --command="ALTER TABLE users ADD COLUMN password_salt TEXT;" || true
          wrangler d1 execute chemistry-equations-db --remote --file=schema.sql
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy
