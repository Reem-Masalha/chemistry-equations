name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('_site')
          sha='${GITHUB_SHA}'
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              text=text.replace('loadStudentProduct();','')

              if html.name=='learn.html':
                  # Learn has exactly one Daily Challenge implementation.
                  # Strip every older challenge/student-experience loader so it cannot compete with v7/v8.
                  text=re.sub(r'<script[^>]+src=[\"\'][^\"\']*(?:student-experience|daily-challenge)[^\"\']+\.js(?:\?[^\"\']*)?[\"\'][^>]*></script>\s*','',text,flags=re.I)
                  text=re.sub(r'<script[^>]+data-daily-(?:v5|v6|v7|v8)-loader[^>]*></script>\s*','',text,flags=re.I)
                  text=text.replace('</head>','<link rel="stylesheet" href="legacy-daily-hide.css?v='+sha+'" data-legacy-daily-hide="1">\n</head>',1)
                  text=text.replace('</body>','<script src="daily-challenge-v7.js?v='+sha+'" defer data-daily-challenge-v7="1"></script>\n<script src="daily-challenge-v8.js?v='+sha+'" defer data-daily-challenge-v8="1"></script>\n</body>',1)

              if 'data-site-modern-refresh' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="modern-refresh.css?v='+sha+'" data-site-modern-refresh="1">\n</head>',1)

              if html.name!='learn.html' and 'data-student-experience-v3' not in text:
                  text=text.replace('</body>','<script src="student-experience-v3.js?v='+sha+'" defer data-student-experience-v3="1"></script>\n</body>',1)

              if html.name=='admin.html' and 'data-admin-tools' not in text:
                  text=text.replace('</body>','<script src="admin-tools.js?v='+sha+'" defer data-admin-tools="1"></script>\n</body>',1)
              if html.name=='profile.html' and 'data-admin-tools-profile' not in text:
                  text=text.replace('</body>','<script src="admin-tools.js?v='+sha+'" defer data-admin-tools-profile="1"></script>\n</body>',1)
              html.write_text(text,encoding='utf-8')
          PY

          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/personal-quiz.html
          test -s _site/challenges.html
          test -s _site/checker.html
          test -s _site/profile.html
          test -s _site/admin.html
          test -s _site/i18n-dictionary.js
          test -s _site/i18n-core.js
          test -s _site/i18n-enhancements.js
          test -s _site/student-product.js
          test -s _site/student-product.css
          test -s _site/modern-refresh.css
          test -s _site/legacy-daily-hide.css
          test -s _site/daily-challenge-v7.js
          test -s _site/daily-challenge-v8.js
          test -s _site/admin-tools.js

          python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site')
          scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'): scripts.add(src.lstrip('./'))
          scripts.update({'i18n-dictionary.js','i18n-core.js','i18n-enhancements.js','student-product.js','student-experience-v3.js','daily-challenge-v7.js','daily-challenge-v8.js','admin-tools.js'})
          missing=[src for src in sorted(scripts) if not (root/src).exists()]
          if missing: raise SystemExit('Missing referenced/dynamic scripts: '+', '.join(missing))
          PY

          while IFS= read -r f; do node --check "$f" >/dev/null; done < <(python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site'); scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'): scripts.add(src.lstrip('./'))
          scripts.update({'i18n-dictionary.js','i18n-core.js','i18n-enhancements.js','student-product.js','student-experience-v3.js','daily-challenge-v7.js','daily-challenge-v8.js','admin-tools.js'})
          for src in sorted(scripts): print(root/src)
          PY
          )

          # Build-time guards for the exact regressions reported during development.
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('_site/learn.html')
          t=p.read_text(encoding='utf-8',errors='ignore')
          if 'daily-challenge-v7.js' not in t: raise SystemExit('v7 challenge not injected')
          if 'daily-challenge-v8.js' not in t: raise SystemExit('v8 completion layer not injected')
          if 'daily-challenge-v5.js' in t or 'daily-challenge-v6.js' in t or 'daily-challenge-final.js' in t: raise SystemExit('old challenge loader remains')
          if 'student-experience-v3.js' in t: raise SystemExit('legacy student experience remains on Learn')

          for page in pathlib.Path('_site').glob('*.html'):
              html=page.read_text(encoding='utf-8',errors='ignore')
              if 'theme.js?v=20260901-sitewide-9' not in html:
                  raise SystemExit(f'unified theme/localization loader missing from {page.name}')

          language_css=pathlib.Path('_site/site-language.css').read_text(encoding='utf-8')
          if 'data-i18n-auto-dir="ltr"' not in language_css:
              raise SystemExit('content-aware LTR fallback is missing')
          if 'article.card>.equation{text-align:right' in language_css:
              raise SystemExit('RTL language mode still right-aligns LTR equations')

          mobile_css=pathlib.Path('_site/modern-refresh.css').read_text(encoding='utf-8')
          if 'overflow-x:clip!important' not in mobile_css:
              raise SystemExit('site-wide mobile overflow containment is missing')
          if '.challenge-answer{display:grid!important' not in mobile_css:
              raise SystemExit('challenge form mobile containment is missing')
          PY

          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf 'chemistry-equations-pages-%s\n' "$GITHUB_SHA" > _site/SITE_BUILD_VERSION.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
