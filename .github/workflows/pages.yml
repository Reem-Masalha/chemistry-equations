name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Balancer files
        run: |
          set -e
          test -f index.html
          test -f handwriting-controls.js
          grep -q 'id="undoPad"' index.html
          grep -q 'id="redoPad"' index.html
          grep -q 'id="erasePad"' index.html
          grep -q 'id="clearPad"' index.html
          grep -q 'handwriting-controls.js' index.html
          echo "Balancer handwriting controls verified in Pages artifact"
          echo "Deploying commit: $GITHUB_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
