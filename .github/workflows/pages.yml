name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/admin.html
          test -s _site/visitor-tracker.js
          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf '%s\n' 'chemistry-equations-pages-20260828-7' > _site/SITE_BUILD_VERSION.txt
          echo "PAGES_SOURCE_COMMIT=$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
