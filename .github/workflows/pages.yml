name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do node --check "$f" >/dev/null; done < <(find . -type f -name '*.js' -not -path './.git/*' -print)

      - name: Verify local assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.')
          missing=[]
          for page in root.glob('*.html'):
              text=page.read_text(encoding='utf-8',errors='ignore')
              for ref in re.findall(r'(?:href|src)=[\"\']([^\"\']+)[\"\']',text,re.I):
                  ref=ref.split('?',1)[0].split('#',1)[0]
                  if not ref or ref.startswith(('#','/','http://','https://','mailto:','tel:','data:','javascript:')): continue
                  if not (page.parent/ref).exists(): missing.append(f'{page.name} -> {ref}')
          if missing: raise SystemExit('Broken local HTML asset references: '+', '.join(missing))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
