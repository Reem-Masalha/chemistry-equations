name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/personal-quiz.html
          test -s _site/challenges.html
          test -s _site/checker.html
          test -s _site/profile.html
          test -s _site/language-clean.js
          test -s _site/i18n-core.js
          test -s _site/account.js

          # Validate JavaScript that is actually referenced by the published pages,
          # plus the small set of known dynamically loaded localization scripts.
          python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site')
          scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'):
                      scripts.add(src.lstrip('./'))
          scripts.update({
              'site-language-v2.js',
              'i18n-enhancements.js',
              'learn-full-i18n.js',
              'learn-extra-i18n.js',
          })
          missing=[]
          for src in sorted(scripts):
              p=root/src
              if p.exists(): print(p)
              else: missing.append(src)
          if missing:
              raise SystemExit('Missing referenced/dynamic scripts: '+', '.join(missing))
          PY
          while IFS= read -r f; do
            node --check "$f" >/dev/null
          done < <(python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site'); scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'): scripts.add(src.lstrip('./'))
          scripts.update({'site-language-v2.js','i18n-enhancements.js','learn-full-i18n.js','learn-extra-i18n.js'})
          for src in sorted(scripts): print(root/src)
          PY
          )

          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf 'chemistry-equations-pages-%s\n' "$GITHUB_SHA" > _site/SITE_BUILD_VERSION.txt
          echo "PAGES_SOURCE_COMMIT=$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4