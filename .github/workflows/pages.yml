name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          # Cache-bust shared site scripts on every Pages build. Match complete
          # filenames so search-fix-20260908.js is never accidentally rewritten
          # as if it were search-fix.js.
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          sha='${GITHUB_SHA}'
          replacements={
              'language-clean.js': 'language-clean.js?v='+sha,
              'theme.js': 'theme.js?v='+sha,
              'search-fix.js': 'search-fix.js?v='+sha,
              'visitor-tracker.js': 'visitor-tracker.js?v='+sha,
          }
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for name,new in replacements.items():
                  pattern=re.escape(name)+r'(?:\?[^"\']*)?(?=["\']|\s|$)'
                  text=re.sub(pattern, new, text)
              html.write_text(text, encoding='utf-8')
          PY

          # Load the global dark-mode overrides on every HTML page, including
          # legacy pages that do not use the main style.css/theme.js combination.
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          tag='<link rel="stylesheet" href="dark-global.css?v=${GITHUB_SHA}">'
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              if 'dark-global.css' not in text:
                  if re.search(r'</head>', text, re.I):
                      text=re.sub(r'</head>', tag+'\n</head>', text, count=1, flags=re.I)
                  else:
                      text=tag+'\n'+text
                  html.write_text(text, encoding='utf-8')
          PY

          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/personal-quiz.html
          test -s _site/challenges.html
          test -s _site/checker.html
          test -s _site/profile.html
          test -s _site/language-clean.js
          test -s _site/i18n-safe.js
          test -s _site/account.js
          test -s _site/dark-global.css

          # Verify that every statically referenced JavaScript file exists.
          python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site')
          scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'):
                      scripts.add(src.lstrip('./'))
          scripts.update({'site-language-v2.js','learn-full-i18n.js','learn-extra-i18n.js'})
          missing=[]
          for src in sorted(scripts):
              p=root/src
              if p.exists(): print(p)
              else: missing.append(src)
          if missing:
              raise SystemExit('Missing referenced/dynamic scripts: '+', '.join(missing))
          PY

          # Syntax-check all referenced scripts except the known legacy theme.js.
          while IFS= read -r f; do
            case "$f" in
              _site/theme.js) continue ;;
            esac
            node --check "$f" >/dev/null
          done < <(python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site'); scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'): scripts.add(src.lstrip('./'))
          scripts.update({'site-language-v2.js','learn-full-i18n.js','learn-extra-i18n.js'})
          for src in sorted(scripts): print(root/src)
          PY
          )

          node --check _site/search-fix.js
          node --check _site/search-fix-20260908.js

          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf 'chemistry-equations-pages-%s\n' "$GITHUB_SHA" > _site/SITE_BUILD_VERSION.txt
          echo "PAGES_SOURCE_COMMIT=$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
