name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/admin.html
          test -s _site/visitor-tracker.js

          # Remove the legacy freeze-prone language cleaner.
          find _site -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -i 's#<script[^>]*language-clean\.js[^>]*></script>##g' "$f"
            # Add the stable shared translator exactly once.
            if ! grep -q 'site-language.js' "$f"; then
              sed -i 's#</body>#<script src="site-language.js?v=20260829-41" defer></script></body>#' "$f"
            fi
            # Add the visible selector exactly once.
            if ! grep -q 'language-button.js' "$f"; then
              sed -i 's#</body>#<script src="language-button.js?v=20260829-41" defer></script></body>#' "$f"
            fi
          done

          # Normalize only our cache-busting build marker in HTML references.
          find _site -type f -name '*.html' -exec sed -i 's/20260829-[0-9A-Za-z-]*/20260829-41/g' {} +

          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf 'chemistry-equations-pages-%s\n' "$GITHUB_SHA" > _site/SITE_BUILD_VERSION.txt
          echo "PAGES_SOURCE_COMMIT=$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
