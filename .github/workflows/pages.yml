name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Build clean Pages artifact
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          tar --exclude='./.git' --exclude='./_site' -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'id="undoPad"' _site/index.html
          grep -q 'id="redoPad"' _site/index.html
          grep -q 'id="erasePad"' _site/index.html
          grep -q 'id="clearPad"' _site/index.html
          grep -q 'handwriting-controls.js' _site/index.html
          echo "Pages artifact commit: $GITHUB_SHA"
          echo "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload clean Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
