name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll

          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          sha='${GITHUB_SHA}'
          asset_re=re.compile(r'((?:src|href)\s*=\s*)(["\'])([^"\']+)(\2)', re.I)
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              # navigation-fix.js installs a document-wide MutationObserver that
              # repeatedly schedules navigation rewrites. nav-global.js is now
              # the single navigation layout runtime, so do not ship the old fixer.
              text=re.sub(r'<script[^>]+src=["\'][^"\']*navigation-fix\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*', '', text, flags=re.I)
              def repl(m):
                  url=m.group(3)
                  if re.match(r'^(?:[a-z][a-z0-9+.-]*:|//|data:|#)', url, re.I):
                      return m.group(0)
                  path, _, frag=url.partition('#')
                  path, _, _oldq=path.partition('?')
                  if not re.search(r'\.(?:js|css)$', path, re.I):
                      return m.group(0)
                  return m.group(1)+m.group(2)+path+'?v='+sha+(('#'+frag) if frag else '')+m.group(4)
              text=asset_re.sub(repl, text)
              if 'cache-bust.js?v='+sha not in text:
                  tag='<script src="cache-bust.js?v='+sha+'"></script>'
                  if re.search(r'</head>', text, re.I):
                      text=re.sub(r'</head>', tag+'\n</head>', text, count=1, flags=re.I)
                  else:
                      text=tag+'\n'+text
              html.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          theme=root/'theme.js'
          if theme.exists():
              text=theme.read_text(encoding='utf-8', errors='ignore')
              # theme.js previously rebuilt Practice/Tools nav groups. Keep its
              # theme, account and search functionality, but leave navigation
              # structure exclusively to nav-global.js.
              patched=re.sub(r'(if\(document\.querySelector\([\'\"]\.topbar[\'\"]\)\)\{)applyNav\(\);', r'\1', text, count=1)
              if patched == text:
                  patched=text.replace('applyNav();','',1)
              theme.write_text(patched, encoding='utf-8')
          PY

          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          tag='<link rel="stylesheet" href="dark-global.css?v=${GITHUB_SHA}">'
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              if 'dark-global.css' not in text:
                  if re.search(r'</head>', text, re.I):
                      text=re.sub(r'</head>', tag+'\n</head>', text, count=1, flags=re.I)
                  else:
                      text=tag+'\n'+text
                  html.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          nav_tag='<script src="nav-global.js?v=${GITHUB_SHA}"></script>'
          account_tag='<script src="account.js?v=${GITHUB_SHA}"></script>'
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              changed=False
              if 'nav-global.js' not in text:
                  tag=nav_tag
                  if re.search(r'</body>', text, re.I):
                      text=re.sub(r'</body>', tag+'\n</body>', text, count=1, flags=re.I)
                  else:
                      text=text+'\n'+tag+'\n'
                  changed=True
              # Apply the shared UI translation dictionary to every page. This
              # supplements page-specific lesson translations and observes dynamic UI.
              if 'site-language-complete-v2.js' not in text:
                  if re.search(r'</body>', text, re.I):
                      text=re.sub(r'</body>', '<script src="site-language-complete-v2.js?v=${GITHUB_SHA}"></script>\\n</body>', text, count=1, flags=re.I)
                  else:
                      text=text+'\\n<script src="site-language-complete-v2.js?v=${GITHUB_SHA}"></script>\\n'
                  changed=True
              # Every page that displays the account control must bind its click
              # action, even when that page did not originally load account.js.
              if 'id="accountTopBtn"' in text and not re.search(r'<script[^>]+src=["\'][^"\']*account\.js(?:\?[^"\']*)?["\']', text, re.I):
                  if re.search(r'</body>', text, re.I):
                      text=re.sub(r'</body>', account_tag+'\n</body>', text, count=1, flags=re.I)
                  else:
                      text=text+'\n'+account_tag+'\n'
                  changed=True
              if changed:
                  html.write_text(text, encoding='utf-8')
          PY

          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/personal-quiz.html
          test -s _site/challenges.html
          test -s _site/checker.html
          test -s _site/profile.html
          test -s _site/language-clean.js
          test -s _site/i18n-safe.js
          test -s _site/account.js
          test -s _site/dark-global.css
          test -s _site/nav-global.js
          test -s _site/cache-bust.js

          python3 - <<'PY'
          import html.parser, pathlib, re
          from urllib.parse import unquote, urlsplit
          root = pathlib.Path('_site')
          refs = []
          class RefParser(html.parser.HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('href', 'src') and value:
                          refs.append((self.page, key, value.strip()))
          for page in sorted(root.glob('*.html')):
              parser = RefParser(page)
              parser.feed(page.read_text(encoding='utf-8', errors='ignore'))
          missing = []
          for page, attr, raw in refs:
              parts = urlsplit(raw)
              if parts.scheme or parts.netloc or raw.startswith('#') or parts.path == '':
                  continue
              path = unquote(parts.path)
              if path.startswith('/'):
                  path = path.lstrip('/')
                  if path.startswith('chemistry-equations/'):
                      path = path[len('chemistry-equations/'):]
              target = (root / path).resolve()
              if not target.is_relative_to(root.resolve()):
                  continue
              if path.endswith('/'):
                  target = target / 'index.html'
              if not target.is_file():
                  missing.append(f'{page.relative_to(root)} [{attr}="{raw}"]')
          if missing:
              raise SystemExit('Broken local HTML references:\\n  ' + '\\n  '.join(missing))
          print(f'Validated {len(refs)} local and external href/src references across HTML pages')
          PY

          python3 - <<'PY'
          import html.parser, pathlib
          root = pathlib.Path('_site')
          failures = []
          class AccessibilityBasics(html.parser.HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
                  self.lang = ''
                  self.title = ''
                  self.in_title = False
                  self.viewport = False
                  self.main_count = 0
                  self.meta_refresh = False
                  self.images_missing_alt = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'html': self.lang = (attrs.get('lang') or '').strip()
                  elif tag == 'title': self.in_title = True
                  elif tag == 'meta':
                      if (attrs.get('name') or '').lower() == 'viewport': self.viewport = True
                      if (attrs.get('http-equiv') or '').lower() == 'refresh': self.meta_refresh = True
                  elif tag == 'main': self.main_count += 1
                  elif tag == 'img' and 'alt' not in attrs: self.images_missing_alt.append(attrs.get('src', '(no src)'))
              def handle_endtag(self, tag):
                  if tag == 'title': self.in_title = False
              def handle_data(self, data):
                  if self.in_title: self.title += data
          for page in sorted(root.glob('*.html')):
              audit = AccessibilityBasics(page)
              audit.feed(page.read_text(encoding='utf-8', errors='ignore'))
              name = str(page.relative_to(root))
              if not audit.lang: failures.append(f'{name}: missing html lang attribute')
              if not audit.title.strip(): failures.append(f'{name}: missing or empty title')
              if not audit.viewport: failures.append(f'{name}: missing viewport metadata')
              # quiz.html is an intentional immediate redirect to personal-quiz.html.
              if audit.main_count != 1 and not (name == 'quiz.html' and audit.meta_refresh and audit.main_count == 0):
                  failures.append(f'{name}: expected one main landmark, found {audit.main_count}')
              for src in audit.images_missing_alt:
                  failures.append(f'{name}: image missing alt attribute ({src})')
          if failures:
              raise SystemExit('HTML accessibility/structure checks failed:\\n  ' + '\\n  '.join(failures))
          print(f'Validated language, title, viewport, main landmark and image alt attributes across {len(list(root.glob("*.html")))} HTML pages')
          PY

          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path('_site')
          scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'): scripts.add(src.lstrip('./'))
          scripts.update({'site-language-v2.js','learn-full-i18n.js','learn-extra-i18n.js'})
          missing=[]
          for src in sorted(scripts):
              p=root/src
              if p.exists(): print(p)
              else: missing.append(src)
          if missing:
              raise SystemExit('Missing referenced/dynamic scripts: '+', '.join(missing))
          PY

          while IFS= read -r f; do
            case "$f" in
              _site/theme.js) continue ;;
            esac
            node --check "$f" >/dev/null
          done < <(python3 - <<'PY'
          import re, pathlib
          root=pathlib.Path('_site'); scripts=set()
          for html in root.glob('*.html'):
              text=html.read_text(encoding='utf-8', errors='ignore')
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I):
                  src=src.split('?',1)[0].split('#',1)[0]
                  if src.endswith('.js'): scripts.add(src.lstrip('./'))
          scripts.update({'site-language-v2.js','learn-full-i18n.js','learn-extra-i18n.js'})
          for src in sorted(scripts): print(root/src)
          PY
          )

          node --check _site/search-fix.js
          node --check _site/search-fix-20260908.js
          node --check _site/nav-global.js

          node --test _site/cloudflare/tests/progress-sync.test.mjs
          node --test _site/cloudflare/tests/i18n-coverage.test.mjs

          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('_site')
          sitemap = root / 'sitemap.xml'
          robots = root / 'robots.txt'
          if not sitemap.is_file() or not robots.is_file():
              raise SystemExit('SEO files missing: sitemap.xml and robots.txt must be deployed')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          tree = ET.parse(sitemap)
          urls = [node.text for node in tree.findall('.//sm:loc', ns)]
          required = {
              'https://reem-masalha.github.io/chemistry-equations/',
              'https://reem-masalha.github.io/chemistry-equations/learn.html',
              'https://reem-masalha.github.io/chemistry-equations/beginner-lessons.html',
              'https://reem-masalha.github.io/chemistry-equations/intermediate-lessons.html',
              'https://reem-masalha.github.io/chemistry-equations/advanced-lessons.html',
              'https://reem-masalha.github.io/chemistry-equations/challenges.html',
              'https://reem-masalha.github.io/chemistry-equations/checker.html',
              'https://reem-masalha.github.io/chemistry-equations/personal-quiz.html',
          }
          missing = sorted(required - set(urls))
          if missing:
              raise SystemExit('Sitemap missing public pages: ' + ', '.join(missing))
          if 'Sitemap: https://reem-masalha.github.io/chemistry-equations/sitemap.xml' not in robots.read_text(encoding='utf-8'):
              raise SystemExit('robots.txt does not point to sitemap.xml')
          print(f'Validated sitemap.xml ({len(urls)} URLs) and robots.txt')
          PY

          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf 'chemistry-equations-pages-%s\n' "$GITHUB_SHA" > _site/SITE_BUILD_VERSION.txt
          echo "PAGES_SOURCE_COMMIT=$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4