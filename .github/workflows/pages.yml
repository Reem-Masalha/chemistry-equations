name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'id="undoPad"' _site/index.html
          grep -q 'id="redoPad"' _site/index.html
          grep -q 'id="erasePad"' _site/index.html
          grep -q 'id="clearPad"' _site/index.html
          grep -q 'handwriting-controls.js' _site/index.html
          echo "DEPLOYED_COMMIT=$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
