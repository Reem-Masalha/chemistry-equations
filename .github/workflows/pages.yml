name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          git archive HEAD | tar -x -C _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/learn.html
          test -s _site/admin.html
          test -s _site/visitor-tracker.js

          # Build every HTML page from one language system only.
          find _site -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's#<script[^>]*src="[^"]*(language-clean|language-safe|language-final-fix|language-switch-fix|language-v2|language\.js|site-i18n-fix|i18n-site-hotfix|i18n-universal-fix|translation-runtime-fix|learn-content-i18n|learn-mini-course-i18n|language-button|site-language\.js|site-language-v2|site-language-final)\.js[^>]*></script>##g' "$f"
            sed -i -E 's#<link[^>]*site-language[^>]*>##g' "$f"
            sed -i -E 's#<script[^>]*history-equation-(stability|fix-v2|final)\.js[^>]*></script>##g' "$f"
            sed -i 's#</head>#<link rel="stylesheet" href="site-language-final.css?v=20260829-50"></head>#' "$f"
            sed -i 's#</body>#<script src="site-language-final.js?v=20260829-50" defer></script></body>#' "$f"
          done

          sed -i 's#</body>#<script src="history-equation-final.js?v=20260829-50" defer></script></body>#' _site/index.html

          printf '%s\n' "$GITHUB_SHA" > _site/DEPLOYMENT_COMMIT.txt
          printf 'chemistry-equations-pages-%s\n' "$GITHUB_SHA" > _site/SITE_BUILD_VERSION.txt
          echo "PAGES_SOURCE_COMMIT=$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
